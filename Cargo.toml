[package]
name = "vshot"
version = "0.1.10"
edition = "2021"
rust-version = "1.88"
description = "A strict-freeze Wayland screenshot CLI for wlroots compositors"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
memmap2 = "0.9.11"
# The HDR half's default format.  `image`'s AVIF encoder cannot carry one: it
# always writes eight bits (`AvifEncoder::new_with_speed_quality` hardcodes
# `BitDepth::Eight`), and the colour description comes from `ravif`, which
# hardcodes sRGB / BT.709 whatever the pixels are.  `rav1e` writes the AV1
# payload and `avif-serialize` the container, so both the sequence header and
# the `colr` box can say BT.2020 PQ.  See `src/model/avif.rs`.
#
# Reading AVIF back is `dav1d` (the AV1 decoder, over the system `libdav1d`)
# and `mp4parse` (the ISOBMFF container).  Both are behind the `avif` feature:
# they are the expensive part of the build, and a build that does not want the
# AVIF codec should not pay for them.  `image`'s own `avif-native` feature is
# the same two crates plus its own YUV handling, but it hands back an RGB image
# and drops the CICP triple this side needs, so the crates are used directly.
rav1e = { version = "0.8.1", default-features = false, features = ["threading"], optional = true }
avif-serialize = { version = "0.8.9", optional = true }
dav1d = { version = "0.11.0", optional = true }
mp4parse = { version = "0.17.0", optional = true }
# OCR, for `vshot ocr` and the editor's text tool. `oar-ocr` runs PaddleOCR's
# own PP-OCR models (converted to ONNX) on ONNX Runtime, and the ONNX Runtime
# it links against is the system one rather than a downloaded copy, so the
# binary stays small and the runtime stays whatever the distribution ships.
# `default-features = false` drops the automatic ONNX Runtime download; the
# `ort` line below restores only what this side needs.
oar-ocr = { version = "0.9.2", default-features = false }
# `oar-ocr` pins `ort` itself but without the provider features; the explicit
# dependency is what turns on `pkg-config`, so the system `libonnxruntime` is
# found instead of one being fetched at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "pkg-config",
] }
# The `image` encoder cannot state a pixel density, so PNGs that have to carry
# one are encoded directly; already in the graph via `image`.
png = "0.18"
rustix = { version = "1.1.4", features = ["event", "pipe", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The recording loop stops cleanly on SIGINT/SIGTERM: the flag registration
# is what makes a signal set an `AtomicBool` without an unsafe handler.
signal-hook = "0.4.4"
# Translation, for `vshot translate` and the overlay's translate mode. `ureq`
# is a blocking HTTP client with no async runtime behind it, which is what a
# command that runs once and exits wants; `json` gives it serde integration.
ureq = { version = "3.4.2", features = ["json"] }
# Baidu's API signs its request with an MD5 digest of appid + text + salt +
# secret; RustCrypto's `md-5` is the digest, and it is not in the tree yet.
md-5 = "0.10.6"
# `dlopen` for libva, and the open/close of the DRM render node.  libc is
# already in the tree through other dependencies; naming it makes it a direct
# dependency of the one module that drops to the C ABI.
libc = "0.2.189"
tempfile = "3.27.0"
thiserror = "2.0.20"
wayland-client = "0.31.13"
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# KWin has no wlr-screencopy and exposes screenshots only over its private
# ScreenShot2 D-Bus service, so the KDE backend needs a bus client.  The
# default features pull in `async-io` + `blocking-api`; tokio is deliberately
# not involved.
zbus = "5.19.0"

[build-dependencies]
# Compiles src/record/shim.c, the libavcodec encoder boundary.
cc = "1.2"

[features]
# Every HDR file format is on by default; a build that wants fewer turns them
# off.  The one that costs anything is `avif`, which is most of the build time
# an HDR capture path adds.
default = ["avif", "radiance", "png"]

# The AVIF codec: `rav1e` and `avif-serialize` to write a ten-bit PQ file, and
# `dav1d` and `mp4parse` to read one back.  `dav1d-sys` links the system
# `libdav1d`, so a build without this feature needs no dav1d at all.
avif = ["dep:rav1e", "dep:avif-serialize", "dep:dav1d", "dep:mp4parse"]

# The Radiance RGBE codec.  It has no dependencies of its own, so this buys no
# build time; it is a feature so that the codec list has one shape rather than
# an exception, and so a build can offer exactly the formats it wants.
radiance = []

# The PNG codec, the SDR half of every capture.  It has no dependencies of its
# own either -- the `png` crate is unconditional, because a capture cannot be
# written without it -- but it is a feature for the same reason `radiance` is:
# the registry offers what was compiled in, and this is what says so.
png = []

# `rav1e`'s hand-written x86 SIMD, which needs `nasm` on PATH at build time.
# Off by default so a build without nasm still works; worth turning on for a
# package, because it is most of the time an AVIF of a 4K capture takes.  It
# implies `avif`, since the SIMD it turns on is the encoder's.
#
#     cargo build --release --features avif-asm
#
avif-asm = ["avif", "rav1e/asm"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Debug info for the recording investigation; stripped from the packaged
# binary by `strip = true` anyway for the parts that do not matter.
debug = 1
